<svg width="630" height="500" viewBox="0 0 630 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1e1f26"/>
      <stop offset="50%" style="stop-color:#0b0c10"/>
      <stop offset="100%" style="stop-color:#060608"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#fbbf24"/>
      <stop offset="100%" style="stop-color:#f59e0b"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#a855f7"/>
      <stop offset="100%" style="stop-color:#7c3aed"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="10" flood-color="#fbbf24" flood-opacity="0.3"/>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="630" height="500" fill="url(#bgGrad)"/>
  
  <!-- Decorative geometric shapes -->
  <g opacity="0.05">
    <circle cx="100" cy="100" r="150" fill="#a855f7"/>
    <circle cx="530" cy="400" r="180" fill="#fbbf24"/>
  </g>
  
  <!-- Title -->
  <text x="315" y="60" text-anchor="middle" font-size="36" fill="url(#goldGrad)" font-weight="bold" font-family="monospace" filter="url(#glow)">ПОСЛЕДНИЙ ЧЕЛОВЕК</text>
  <text x="315" y="90" text-anchor="middle" font-size="16" fill="#fbbf24" font-family="monospace" letter-spacing="4">АГЕНТСТВО МОНСТРОВ</text>
  
  <!-- Main scene: Human at desk, monsters in queue -->
  <g transform="translate(315, 280)" filter="url(#shadow)">
    <!-- Desk -->
    <path d="M-200 60 L-200 120 L200 120 L200 60 Q210 60 210 50 L210 40 Q210 30 200 30 L-200 30 Q-210 30 -210 40 L-210 50 Q-210 60 -200 60" fill="#2d1f14"/>
    <rect x="-190" y="35" width="380" height="5" fill="#1a1814" opacity="0.5"/>
    
    <!-- Human (Last Human) -->
    <g transform="translate(0, -40)">
      <!-- Body -->
      <ellipse cx="0" cy="50" rx="30" ry="35" fill="#374151"/>
      <!-- Head -->
      <ellipse cx="0" cy="-10" rx="22" ry="24" fill="#fbcfe8"/>
      <!-- Hair (messy, tired) -->
      <path d="M-22 -30 Q-15 -45 0 -40 Q15 -45 22 -30 Q18 -32 0 -30 Q-18 -32 -22 -30" fill="#1f2937"/>
      <!-- Tired eyes -->
      <ellipse cx="-7" cy="-12" rx="3" ry="2" fill="#111827"/>
      <ellipse cx="7" cy="-12" rx="3" ry="2" fill="#111827"/>
      <line x1="-10" y1="-10" x2="-4" y2="-10" stroke="#6b7280" stroke-width="1"/>
      <line x1="4" y1="-10" x2="10" y2="-10" stroke="#6b7280" stroke-width="1"/>
      <!-- Stubble -->
      <g stroke="#6b7280" stroke-width="0.5">
        <line x1="-15" y1="5" x2="-13" y2="8"/>
        <line x1="-10" y1="8" x2="-8" y2="11"/>
        <line x1="10" y1="5" x2="12" y2="8"/>
        <line x1="15" y1="8" x2="13" y2="11"/>
      </g>
      <!-- Suit -->
      <path d="M-15 20 L-5 45 L5 45 L15 20" fill="#1f2937"/>
      <path d="M-3 25 L0 45 L3 25" fill="#fbbf24"/>
    </g>
    
    <!-- Papers on desk -->
    <g fill="#fef3c7" transform="translate(-80, 10)">
      <rect x="0" y="0" width="50" height="65" rx="1" transform="rotate(-5 25 32)" filter="url(#shadow)"/>
      <rect x="10" y="10" width="45" height="55" rx="1" transform="rotate(2 32 37)" fill="#fde68a"/>
    </g>
    <g fill="#fef3c7" transform="translate(40, 15)">
      <rect x="0" y="0" width="55" height="60" rx="1" transform="rotate(3 27 30)" filter="url(#shadow)"/>
    </g>
  </g>
  
  <!-- Monster queue (left to right) -->
  <g font-family="monospace" font-size="11" fill="#f1f5f9">
    <!-- Goblin -->
    <g transform="translate(50, 350)">
      <use href="#goblinIcon" width="50" height="50"/>
      <text x="25" y="85" text-anchor="middle" fill="#4ade80">Гоблин</text>
      <text x="25" y="100" text-anchor="middle" fill="#64748b" font-size="9">⟳ Собеседование</text>
    </g>
    
    <!-- Orc -->
    <g transform="translate(130, 350)">
      <use href="#orcIcon" width="50" height="50"/>
      <text x="25" y="85" text-anchor="middle" fill="#4ade80">Оук</text>
      <text x="25" y="100" text-anchor="middle" fill="#64748b" font-size="9">⟳ Собеседование</text>
    </g>
    
    <!-- Skeleton -->
    <g transform="translate(210, 350)">
      <use href="#skeletonIcon" width="50" height="50"/>
      <text x="25" y="85" text-anchor="middle" fill="#a855f7">Скелет</text>
      <text x="25" y="100" text-anchor="middle" fill="#64748b" font-size="9">⟳ Собеседование</text>
    </g>
    
    <!-- Slime -->
    <g transform="translate(290, 350)">
      <use href="#slimeIcon" width="50" height="50"/>
      <text x="25" y="85" text-anchor="middle" fill="#4ade80">Слизь</text>
      <text x="25" y="100" text-anchor="middle" fill="#64748b" font-size="9">⟳ Собеседование</text>
    </g>
    
    <!-- Imp -->
    <g transform="translate(370, 350)">
      <use href="#impIcon" width="50" height="50"/>
      <text x="25" y="85" text-anchor="middle" fill="#f97316">Импу</text>
      <text x="25" y="100" text-anchor="middle" fill="#64748b" font-size="9">⟳ Собеседование</text>
    </g>
    
    <!-- Troll -->
    <g transform="translate(450, 350)">
      <use href="#trollIcon" width="50" height="50"/>
      <text x="25" y="85" text-anchor="middle" fill="#4ade80">Тролль</text>
      <text x="25" y="100" text-anchor="middle" fill="#64748b" font-size="9">⟳ Собеседование</text>
    </g>
    
    <!-- Vampire -->
    <g transform="translate(530, 350)">
      <use href="#vampireIcon" width="50" height="50"/>
      <text x="25" y="85" text-anchor="middle" fill="#a855f7">Вампир</text>
      <text x="25" y="100" text-anchor="middle" fill="#64748b" font-size="9">⟳ Собеседование</text>
    </g>
  </g>
  
  <!-- Job board with one intercepted -->
  <g transform="translate(480, 80)" filter="url(#shadow)">
    <rect x="0" y="0" width="130" height="200" rx="4" fill="#2d1f14" stroke="#4a3a2a" stroke-width="2"/>
    <rect x="5" y="5" width="120" height="190" fill="#1e1f26"/>
    <text x="65" y="30" text-anchor="middle" font-size="12" fill="#fbbf24" font-weight="bold" font-family="monospace">ДОСКА ЗАКАЗОВ</text>
    <line x1="10" y1="38" x2="120" y2="38" stroke="#4a3a2a" stroke-width="1"/>
    
    <!-- Available job -->
    <g transform="translate(10, 50)">
      <rect x="0" y="0" width="110" height="35" rx="2" fill="#374151" stroke="#4ade80" stroke-width="1"/>
      <text x="55" y="20" text-anchor="middle" font-size="9" fill="#4ade80" font-family="monospace">Ферма 🐷</text>
      <text x="55" y="32" text-anchor="middle" font-size="8" fill="#f1f5f9" font-family="monospace">150💰  ★★☆☆☆</text>
    </g>
    
    <!-- Intercepted job -->
    <g transform="translate(10, 95)" opacity="0.5">
      <rect x="0" y="0" width="110" height="35" rx="2" fill="#374151" stroke="#64748b" stroke-width="1"/>
      <rect x="0" y="0" width="110" height="35" rx="2" fill="#64748b"/>
      <line x1="0" y1="0" x2="110" y2="35" stroke="#f87171" stroke-width="2"/>
      <text x="55" y="20" text-anchor="middle" font-size="9" fill="#f1f5f9" font-family="monospace">ПЕЩЕРЫ 💎</text>
      <text x="55" y="32" text-anchor="middle" font-size="8" fill="#94a3b8" font-family="monospace">ПЕРЕХВАЧЕНО</text>
    </g>
    
    <!-- Available job -->
    <g transform="translate(10, 140)">
      <rect x="0" y="0" width="110" height="35" rx="2" fill="#374151" stroke="#fbbf24" stroke-width="1"/>
      <text x="55" y="20" text-anchor="middle" font-size="9" fill="#fbbf24" font-family="monospace">РУИНЫ 🏺</text>
      <text x="55" y="32" text-anchor="middle" font-size="8" fill="#f1f5f9" font-family="monospace">300💰  ★★★★☆</text>
    </g>
  </g>
  
  <!-- Tagline -->
  <text x="315" y="470" text-anchor="middle" font-size="13" fill="#94a3b8" font-family="monospace" font-style="italic">«Роли перевернуты. Люди нанимают монстров. Монстры врут. Конкуренты крадут заказы.»</text>
  
  <!-- Icon definitions for queue (simplified versions) -->
  <defs>
    <g id="goblinIcon">
      <ellipse cx="25" cy="25" rx="18" ry="16" fill="#6b8e23"/>
      <ellipse cx="25" cy="12" rx="14" ry="12" fill="#6b8e23"/>
      <ellipse cx="11" cy="12" rx="4" ry="5" fill="#6b8e23"/>
      <ellipse cx="39" cy="12" rx="4" ry="5" fill="#6b8e23"/>
      <ellipse cx="19" cy="11" rx="3" ry="3.5" fill="#1a1a1a"/>
      <ellipse cx="31" cy="11" rx="3" ry="3.5" fill="#1a1a1a"/>
    </g>
    <g id="orcIcon">
      <ellipse cx="25" cy="28" rx="22" ry="14" fill="#3a5a2a"/>
      <ellipse cx="25" cy="12" rx="16" ry="14" fill="#3a5a2a"/>
      <ellipse cx="17" cy="11" rx="3.5" ry="4" fill="#1a1a1a"/>
      <ellipse cx="33" cy="11" rx="3.5" ry="4" fill="#1a1a1a"/>
      <path d="M20 20 L17 28" stroke="#f1f5f9" stroke-width="2"/>
      <path d="M30 20 L33 28" stroke="#f1f5f9" stroke-width="2"/>
    </g>
    <g id="skeletonIcon">
      <ellipse cx="25" cy="18" rx="14" ry="13" fill="#f1f5f9"/>
      <ellipse cx="18" cy="16" rx="4" ry="4.5" fill="#0b0c10"/>
      <ellipse cx="32" cy="16" rx="4" ry="4.5" fill="#0b0c10"/>
      <path d="M21 24 L29 24" stroke="#0b0c10" stroke-width="1.5"/>
    </g>
    <g id="slimeIcon">
      <path d="M25 8 Q37 6 45 18 Q51 30 47 40 Q43 50 25 54 Q7 50 3 40 Q-1 30 5 18 Q11 6 25 8" fill="#4ade80"/>
      <ellipse cx="19" cy="22" rx="4" ry="5" fill="#0b0c10"/>
      <ellipse cx="31" cy="22" rx="4" ry="5" fill="#0b0c10"/>
    </g>
    <g id="impIcon">
      <ellipse cx="25" cy="28" rx="14" ry="12" fill="#c2410c"/>
      <ellipse cx="25" cy="12" rx="13" ry="11" fill="#c2410c"/>
      <path d="M15 8 Q10 -2 16 -8 Q20 -2 20 8" fill="#c2410c"/>
      <path d="M35 8 Q40 -2 34 -8 Q30 -2 30 8" fill="#c2410c"/>
      <ellipse cx="19" cy="11" rx="3" ry="3.5" fill="#0b0c10"/>
      <ellipse cx="31" cy="11" rx="3" ry="3.5" fill="#0b0c10"/>
      <path d="M37 30 Q43 34 41 42" fill="#c2410c"/>
    </g>
    <g id="trollIcon">
      <ellipse cx="25" cy="30" rx="22" ry="14" fill="#5a7c3a"/>
      <ellipse cx="25" cy="12" rx="18" ry="15" fill="#5a7c3a"/>
      <ellipse cx="25" cy="18" rx="6" ry="5" fill="#6b8e23"/>
      <ellipse cx="19" cy="14" rx="3" ry="3.5" fill="#1a1a1a"/>
      <ellipse cx="31" cy="14" rx="3" ry="3.5" fill="#1a1a1a"/>
    </g>
    <g id="vampireIcon">
      <ellipse cx="25" cy="26" rx="14" ry="13" fill="#d4d4d4"/>
      <path d="M11 16 Q17 8 25 10 Q33 8 39 16 Q35 22 25 20 Q15 22 11 16" fill="#1a1a1a"/>
      <ellipse cx="18" cy="20" rx="3.5" ry="4" fill="#0b0c10"/>
      <ellipse cx="32" cy="20" rx="3.5" ry="4" fill="#0b0c10"/>
      <path d="M20 28 L20 32" stroke="#f87171" stroke-width="1.5"/>
      <path d="M30 28 L30 32" stroke="#f87171" stroke-width="1.5"/>
    </g>
  </defs>
</svg>