<svg width="640" height="480" viewBox="0 0 640 480" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="tenderWall" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#2d1f2d"/>
      <stop offset="100%" style="stop-color:#181018"/>
    </linearGradient>
    <linearGradient id="tableGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4a3a2a"/>
      <stop offset="100%" style="stop-color:#2d1f14"/>
    </linearGradient>
    <linearGradient id="heroSuit" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#374151"/>
      <stop offset="100%" style="stop-color:#111827"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#fbbf24"/>
      <stop offset="100%" style="stop-color:#f59e0b"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#a855f7" flood-opacity="0.3"/>
    </filter>
    <filter id="spotlight" x="-50%" y="-50%" width="200%" height="200%">
      <feRadialGradient cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
        <stop offset="0%" style="stop-color:#a855f7;stop-opacity:0.15"/>
        <stop offset="100%" style="stop-color:#a855f7;stop-opacity:0"/>
      </feRadialGradient>
    </filter>
  </defs>
  
  <!-- Wall -->
  <rect width="640" height="480" fill="url(#tenderWall)"/>
  
  <!-- Chandelier -->
  <g stroke="#fbbf24" stroke-width="2" fill="none">
    <line x1="320" y1="0" x2="320" y2="40"/>
    <ellipse cx="320" cy="40" rx="60" ry="8" stroke="#fbbf24" stroke-width="1" fill="none"/>
    <g fill="#fbbf24">
      <ellipse cx="265" cy="42" rx="4" ry="6"/>
      <ellipse cx="320" cy="42" rx="4" ry="6"/>
      <ellipse cx="375" cy="42" rx="4" ry="6"/>
    </g>
  </g>
  
  <!-- Negotiation table -->
  <path d="M80 280 L80 440 L560 440 L560 280 Q570 280 570 270 L570 260 Q570 250 560 250 L80 250 Q70 250 70 260 L70 270 Q70 280 80 280" fill="url(#tableGrad)" filter="url(#shadow)"/>
  <rect x="90" y="255" width="460" height="5" fill="#1a1814" opacity="0.5"/>
  
  <!-- Center spotlight on contract -->
  <ellipse cx="320" cy="255" rx="120" ry="30" fill="url(#spotlight)" filter="url(#glow)"/>
  <!-- Contract document -->
  <g filter="url(#shadow)">
    <rect x="280" y="210" width="80" height="90" rx="2" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
    <rect x="288" y="218" width="64" height="74" fill="#fefce8"/>
    <g stroke="#78350f" stroke-width="1" fill="none">
      <line x1="294" y1="228" x2="350" y2="228"/>
      <line x1="294" y1="242" x2="340" y2="242"/>
      <line x1="294" y1="256" x2="346" y2="256"/>
      <line x1="294" y1="270" x2="338" y2="270"/>
    </g>
    <!-- Seal -->
    <circle cx="320" cy="282" r="10" fill="#fbbf24" opacity="0.3"/>
    <circle cx="320" cy="282" r="6" fill="#f59e0b"/>
  </g>
  
  <!-- Hero Director (left) -->
  <g transform="translate(120, 200)" filter="url(#shadow)">
    <!-- Body -->
    <path d="M0 100 Q-20 80 -20 60 Q-20 40 0 20 Q20 40 20 60 Q20 80 0 100" fill="url(#heroSuit)"/>
    <!-- Head -->
    <ellipse cx="0" cy="-10" rx="18" ry="20" fill="#fbcfe8"/>
    <!-- Hair -->
    <path d="M-18 -20 Q-10 -35 0 -30 Q10 -35 18 -20 Q12 -25 0 -22 Q-12 -25 -18 -20" fill="#1f2937"/>
    <!-- Face -->
    <ellipse cx="-5" cy="-12" rx="2" ry="2.5" fill="#111827"/>
    <ellipse cx="5" cy="-12" rx="2" ry="2.5" fill="#111827"/>
    <path d="M-6 -4 Q0 0 6 -4" stroke="#9ca3af" stroke-width="1.5" fill="none"/>
    <!-- Tie -->
    <path d="M-3 20 L-3 60 L3 60 L3 20" fill="#991b1b"/>
    <!-- Hero emblem on chest -->
    <g fill="#fbbf24">
      <path d="M0 35 L-8 25 L-6 25 L-6 15 L6 15 L6 25 L8 25 Z"/>
    </g>
  </g>
  
  <!-- Player's monsters (right side, 5 slots) -->
  <g id="playerMonsters">
    <!-- Slot 1 -->
    <g transform="translate(420, 180)">
      <ellipse cx="0" cy="60" rx="20" ry="12" fill="#0b0c10" opacity="0.5"/>
      <ellipse cx="0" cy="0" rx="18" ry="30" fill="#374151" opacity="0.3"/>
      <text x="0" y="5" text-anchor="middle" font-size="10" fill="#64748b">СЛОТ 1</text>
    </g>
    <!-- Slot 2 -->
    <g transform="translate(480, 180)">
      <ellipse cx="0" cy="60" rx="20" ry="12" fill="#0b0c10" opacity="0.5"/>
      <ellipse cx="0" cy="0" rx="18" ry="30" fill="#374151" opacity="0.3"/>
      <text x="0" y="5" text-anchor="middle" font-size="10" fill="#64748b">СЛОТ 2</text>
    </g>
    <!-- Slot 3 -->
    <g transform="translate(540, 180)">
      <ellipse cx="0" cy="60" rx="20" ry="12" fill="#0b0c10" opacity="0.5"/>
      <ellipse cx="0" cy="0" rx="18" ry="30" fill="#374151" opacity="0.3"/>
      <text x="0" y="5" text-anchor="middle" font-size="10" fill="#64748b">СЛОТ 3</text>
    </g>
  </g>
  
  <!-- Hero's monsters (left side, 5 slots) -->
  <g id="heroMonsters">
    <g transform="translate(80, 180)">
      <ellipse cx="0" cy="60" rx="20" ry="12" fill="#0b0c10" opacity="0.5"/>
      <ellipse cx="0" cy="0" rx="18" ry="30" fill="#374151" opacity="0.3"/>
      <text x="0" y="5" text-anchor="middle" font-size="10" fill="#64748b">ВРАГ 1</text>
    </g>
    <g transform="translate(20, 180)">
      <ellipse cx="0" cy="60" rx="20" ry="12" fill="#0b0c10" opacity="0.5"/>
      <ellipse cx="0" cy="0" rx="18" ry="30" fill="#374151" opacity="0.3"/>
      <text x="0" y="5" text-anchor="middle" font-size="10" fill="#64748b">ВРАГ 2</text>
    </g>
    <g transform="translate(-40, 180)">
      <ellipse cx="0" cy="60" rx="20" ry="12" fill="#0b0c10" opacity="0.5"/>
      <ellipse cx="0" cy="0" rx="18" ry="30" fill="#374151" opacity="0.3"/>
      <text x="0" y="5" text-anchor="middle" font-size="10" fill="#64748b">ВРАГ 3</text>
    </g>
  </g>
  
  <!-- Submit button (glowing) -->
  <g filter="url(#glow)">
    <rect x="240" y="380" width="160" height="50" rx="8" fill="#7c3aed" stroke="#a855f7" stroke-width="3"/>
    <text x="320" y="412" text-anchor="middle" font-size="18" fill="#f1f5f9" font-weight="bold" font-family="monospace">ОТПРАВИТЬ ЛУЧШЕГО</text>
  </g>
  
  <!-- Day counter -->
  <text x="320" y="60" text-anchor="middle" font-size="24" fill="#fbbf24" font-weight="bold" font-family="monospace">ДЕНЬ 14 — ФИНАЛЬНЫЙ ТЕНДЕР</text>
  
  <!-- VS divider -->
  <text x="320" y="160" text-anchor="middle" font-size="32" fill="#a855f7" font-weight="bold" opacity="0.5">VS</text>
</svg>