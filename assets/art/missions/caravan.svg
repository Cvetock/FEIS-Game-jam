<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="caravanSky" cx="50%" cy="30%" r="70%">
      <stop offset="0%" style="stop-color:#dc2626;stop-opacity:0.4"/>
      <stop offset="100%" style="stop-color:#0b0c10;stop-opacity:0"/>
    </radialGradient>
    <filter id="caravanGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="2" flood-color="#dc2626" flood-opacity="0.3"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="64" height="64" fill="#0b0c10"/>
  <!-- Haunted wagon -->
  <path d="M8 38 L8 24 Q10 20 14 20 L50 20 Q54 20 56 24 L56 38" fill="#111827" opacity="0.95"/>
  <path d="M12 38 L12 24 Q14 20 18 20 L46 20 Q50 20 52 24 L52 38" fill="none" stroke="#4b5563" stroke-width="1"/>
  <!-- Wagon cracks -->
  <g stroke="#0a0a0f" stroke-width="0.5">
    <path d="M14 24 L18 28 M24 24 L28 26 M40 24 L44 26"/>
  </g>
  <!-- Broken wheels -->
  <g fill="#0a0a0f">
    <circle cx="18" cy="40" r="6"/>
    <path d="M18 34 L18 46 M12 40 L24 40" stroke="#374151" stroke-width="1"/>
    <circle cx="46" cy="40" r="6"/>
    <path d="M46 34 L46 46 M40 40 L52 40" stroke="#374151" stroke-width="1"/>
  </g>
  <!-- Wheel spokes broken -->
  <g stroke="#374151" stroke-width="1">
    <path d="M18 34 L16 30 M18 46 L20 50"/>
    <path d="M46 34 L44 30 M46 46 L44 50"/>
  </g>
  <!-- Cargo crates -->
  <g fill="#374151" stroke="#1f2937" stroke-width="1">
    <rect x="14" y="24" width="10" height="10" rx="1"/>
    <rect x="26" y="24" width="10" height="10" rx="1"/>
    <rect x="38" y="24" width="10" height="10" rx="1"/>
  </g>
  <!-- Crate cracks -->
  <g stroke="#0a0a0f" stroke-width="0.5">
    <path d="M14 24 L24 34 M24 24 L14 34"/>
    <path d="M26 24 L36 34 M36 24 L26 34"/>
    <path d="M38 24 L48 34 M48 24 L38 34"/>
  </g>
  <!-- Emaciated horse -->
  <g fill="#1f2937" opacity="0.9">
    <ellipse cx="6" cy="36" rx="8" ry="6"/>
    <ellipse cx="0" cy="32" rx="5" ry="4"/>
    <rect x="-3" y="28" width="3" height="2" fill="#0a0a0f"/>
  </g>
  <circle cx="-3" cy="28" r="1" fill="#dc2626"/>
  <!-- Reins -->
  <path d="M4 32 Q2 28 0 30" stroke="#374151" stroke-width="1.5" fill="none"/>
  <!-- Ribs showing -->
  <g stroke="#9ca3af" stroke-width="0.5" fill="none" opacity="0.7">
    <path d="M4 34 Q2 36 4 38"/>
    <path d="M4 36 Q2 38 4 40"/>
  </g>
  <!-- Red glow -->
  <ellipse cx="32" cy="30" rx="28" ry="18" fill="url(#caravanSky)"/>
</svg>