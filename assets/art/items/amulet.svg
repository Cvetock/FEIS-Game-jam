<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="amuletGlow" cx="50%" cy="30%" r="70%">
      <stop offset="0%" style="stop-color:#a855f7;stop-opacity:0.4"/>
      <stop offset="100%" style="stop-color:#6b21a8;stop-opacity:0"/>
    </radialGradient>
    <filter id="amuletGlowFilter" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#a855f7" flood-opacity="0.5"/>
    </filter>
  </defs>
  <g filter="url(#amuletGlowFilter)">
    <!-- Silver frame -->
    <ellipse cx="32" cy="36" rx="16" ry="18" fill="#9ca3af" opacity="0.95"/>
    <ellipse cx="32" cy="35" rx="12" ry="13" fill="#4b5563" opacity="0.95"/>
    <!-- Dark corrupted gem -->
    <ellipse cx="32" cy="33" rx="10" ry="11" fill="#1a1a1a" opacity="0.98"/>
