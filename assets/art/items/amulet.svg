    <g stroke="#7c3aed" stroke-width="1" fill="none" opacity="0.7">
      <path d="M32 22 Q30 26 32 30 Q34 26 32 22"/>
      <path d="M22 32 Q26 28 30 32 Q26 36 22 32"/>
      <path d="M42 32 Q38 28 34 32 Q38 36 42 32"/>
      <path d="M28 28 Q32 32 36 28"/>
      <path d="M28 36 Q32 36 36 36"/>
