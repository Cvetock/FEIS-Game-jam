  <ellipse cx="32" cy="58" rx="11" ry="1.5" fill="#92400e" opacity="0.8"/>
  <!-- Band rivets -->
  <g fill="#7f1d1d">
    <circle cx="24" cy="46" r="1"/>
    <circle cx="40" cy="46" r="1"/>
    <circle cx="24" cy="58" r="1"/>
    <circle cx="40" cy="58" r="1"/>
  </g>
  <!-- Spikes -->
  <g fill="#111827">
    <path d="M24 48 L22 42 L26 48"/>
    <path d="M32 48 L32 40 L36 48"/>
    <path d="M40 48 L42 42 L38 48"/>
    <path d="M24 58 L22 52 L26 58"/>
    <path d="M40 58 L42 52 L38 58"/>
  </g>
  <!-- Blood drip -->
  <path d="M32 54 Q32 56 34 54 M30 54 Q30 56 32 54" fill="#7f1d1d"/>
  <circle cx="34" cy="56" r="2" fill="#7f1d1d"/>
  <circle cx="32" cy="56" r="1.5" fill="#dc2626"/>
  <!-- Red glow -->
  <ellipse cx="32" cy="40" rx="14" ry="22" fill="url(#clubGlow)"/>
