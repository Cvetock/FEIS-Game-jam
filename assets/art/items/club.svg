  </defs>
  <rect x="0" y="0" width="64" height="64" fill="#0b0c10"/>
  <!-- Splintered handle -->
  <rect x="29" y="20" width="6" height="32" rx="1" fill="#374151" opacity="0.95"/>
  <g fill="#1f2937">
