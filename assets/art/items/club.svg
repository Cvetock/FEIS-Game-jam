<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="clubGlow" cx="50%" cy="30%" r="70%">
      <stop offset="0%" style="stop-color:#dc2626;stop-opacity:0.4"/>
