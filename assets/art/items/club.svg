  <ellipse cx="32" cy="54" rx="12" ry="6" fill="#4b5563" opacity="0.95"/>
  <ellipse cx="32" cy="52" rx="10" ry="4" fill="#374151"/>
  <!-- Head cracks -->
  <g stroke="#1f2937" stroke-width="0.5" fill="none">
    <path d="M24 50 Q28 48 32 52 Q36 48 40 50"/>
    <path d="M26 54 Q32 52 38 54"/>
    <path d="M24 58 Q28 56 32 58 Q36 56 40 58"/>
  </g>
  <!-- Metal bands (rusted) -->
