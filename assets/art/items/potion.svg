<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="potionGlow" cx="50%" cy="30%" r="70%">
      <stop offset="0%" style="stop-color:#dc2626;stop-opacity:0.4"/>
      <stop offset="100%" style="stop-color:#7f1d1d;stop-opacity:0"/>
    </radialGradient>
    <filter id="potionGlowFilter" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#dc2626" flood-opacity="0.4"/>
    </filter>
  </defs>
  <g filter="url(#potionGlowFilter)">
    <!-- Dark glass bottle -->
    <path d="M28 14 L28 8 Q32 4 36 8 L36 14 Q38 14 38 20 L38 46 Q38 50 34 52 L30 52 Q26 50 26 46 L26 20 Q26 14 28 14" fill="#111827" stroke="#374151" stroke-width="1" opacity="0.6"/>
    <!-- Bottle cracks -->
    <g stroke="#0a0a0f" stroke-width="0.5">
      <path d="M28 10 L30 14 M34 10 L32 14 M30 30 L32 34 M34 40 L32 44"/>
    </g>
    <!-- Cursed liquid -->
    <path d="M30 22 Q31 22 32 24 Q33 22 34 22 L34 44 Q34 46 32 47 Q30 46 30 44" fill="#7f1d1d" opacity="0.95"/>
    <!-- Liquid surface -->
    <path d="M30 22 Q32 20 34 22" fill="none" stroke="#4c1d95" stroke-width="0.5"/>
    <!-- Bubbles -->
    <g fill="#fca5a5" opacity="0.7">
      <circle cx="30" cy="36" r="1.5"/>
      <circle cx="34" cy="30" r="1"/>
      <circle cx="31" cy="28" r="0.8"/>
      <circle cx="33" cy="40" r="1.2"/>
      <circle cx="29" cy="44" r="1"/>
    </g>
    <!-- Cork -->
    <ellipse cx="32" cy="11" rx="5" ry="3" fill="#4b5563"/>
    <ellipse cx="32" cy="9" rx="4" ry="1.5" fill="#374151"/>
    <path d="M30 9 L30 11 M34 9 L34 11" stroke="#374151" stroke-width="0.5"/>
    <!-- Label -->
    <rect x="26" y="26" width="12" height="16" rx="1" fill="#374151" opacity="0.8"/>
    <text x="32" y="34" text-anchor="middle" font-size="8" fill="#dc2626" font-weight="bold" font-family="monospace">SKULL</text>
    <text x="32" y="40" text-anchor="middle" font-size="7" fill="#fca5a5" font-family="monospace">+HP</text>
    <!-- Blood drip on bottle -->
    <path d="M32 14 Q32 18 34 14 M30 14 Q30 18 32 14" fill="#7f1d1d" opacity="0.6"/>
  </g>
  <!-- Red glow -->
  <ellipse cx="32" cy="34" rx="14" ry="18" fill="url(#potionGlow)"/>
</svg>