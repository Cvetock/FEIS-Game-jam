      <path d="M20 52 Q22 56 24 52"/>
      <path d="M28 52 Q30 56 32 52"/>
      <path d="M36 52 Q38 56 40 52"/>
      <path d="M44 52 Q46 56 48 52"/>
      <path d="M52 52 Q50 48 48 46 Q46 44 44 42"/>
      <path d="M44 42 Q42 38 40 36 Q38 34 36 32 Q34 30 32 28 Q30 26 28 24 Q26 22 24 20 Q22 18 20 16 Q18 14 16 14 Q14 14 12 16 Q10 18 10 20 Q10 24 10 28 Q10 32 10 36 Q10 40 10 44 Q10 48 12 52"/>
