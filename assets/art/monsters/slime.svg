<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="slimeBody" cx="50%" cy="50%" r="70%">
      <stop offset="0%" style="stop-color:#111827"/>
      <stop offset="50%" style="stop-color:#0b0c10"/>
      <stop offset="100%" style="stop-color:#030712"/>
    </radialGradient>
    <linearGradient id="slimeGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#a855f7"/>
      <stop offset="50%" style="stop-color:#6b21a8"/>
      <stop offset="100%" style="stop-color:#4c1d95"/>
