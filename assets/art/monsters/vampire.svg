<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="vampBody" cx="40%" cy="40%" r="70%">
      <stop offset="0%" style="stop-color:#1f2937"/>
      <stop offset="50%" style="stop-color:#111827"/>
      <stop offset="100%" style="stop-color:#0b0c10"/>
    </radialGradient>
    <linearGradient id="vampSkin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f3f4f6"/>
      <stop offset="50%" style="stop-color:#e5e7eb"/>
      <stop offset="100%" style="stop-color:#d1d5db"/>
    </linearGradient>
    <radialGradient id="vampEye" cx="45%" cy="45%" r="60%">
      <stop offset="0%" style="stop-color:#fca5a5"/>
      <stop offset="100%" style="stop-color:#7f1d1d"/>
    </radialGradient>
    <filter id="vampShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>
  <g filter="url(#vampShadow)">
    <!-- Tattered cape -->
    <path d="M10 52 Q32 44 54 52 L54 64 Q32 58 10 64 Z" fill="#111827" opacity="0.95"/>
    <path d="M16 50 Q32 42 48 50 L48 58 Q32 54 16 58 Z" fill="#1f2937" opacity="0.9"/>
    <!-- Cape edges -->
    <path d="M10 52 Q6 50 8 44 Q10 42 12 46 M32 52 Q28 50 30 44 Q32 42 34 46 M54 52 Q58 50 56 44 Q54 42 52 46" fill="none" stroke="#0a0a0f" stroke-width="1"/>
    <!-- Pale body -->
    <ellipse cx="32" cy="38" rx="12" ry="10" fill="url(#vampSkin)" opacity="0.95"/>
    <path d="M22 32 Q32 40 42 32 Q32 24 22 32 Z" fill="#e5e7eb" opacity="0.9"/>
    <!-- High collar -->
    <path d="M20 26 Q32 20 44 26 Q32 30 20 26 Z" fill="#111827" opacity="0.95"/>
    <!-- Pale skin head -->
    <ellipse cx="32" cy="18" rx="11" ry="10" fill="url(#vampSkin)" opacity="0.95"/>
    <path d="M22 10 Q32 4 42 10 Q32 16 22 10 Z" fill="#d1d5db" opacity="0.9"/>
    <!-- Deep eye sockets -->
    <ellipse cx="25" cy="16" rx="3.5" ry="4" fill="#0a0a0f"/>
    <ellipse cx="39" cy="16" rx="3.5" ry="4" fill="#0a0a0f"/>
    <!-- Glowing red eyes -->
    <circle cx="25" cy="16" r="1.8" fill="url(#vampEye)"/>
    <circle cx="39" cy="16" r="1.8" fill="url(#vampEye)"/>
    <circle cx="25" cy="15.5" r="0.7" fill="#fca5a5"/>
    <circle cx="39" cy="15.5" r="0.7" fill="#fca5a5"/>
    <!-- Nose -->
    <path d="M30 18 L32 22 L34 18" fill="#f3f4f6" opacity="0.9"/>
    <path d="M31 19 L33 19" stroke="#111827" stroke-width="0.5"/>
    <!-- Fangs -->
    <path d="M28 24 L27 30 L29 26 Z" fill="#f3f4f6"/>
    <path d="M36 24 L37 30 L35 26 Z" fill="#f3f4f6"/>
    <!-- Blood on fangs -->
    <g fill="#7f1d1d" opacity="0.7">
      <path d="M27 30 L26 32 L28 30 Z"/>
      <path d="M37 30 L38 32 L36 30 Z"/>
    </g>
    <!-- Blood-red lips -->
    <path d="M26 22 Q32 24 38 22" fill="none" stroke="#dc2626" stroke-width="1.5"/>
    <!-- Elegant ears -->
    <path d="M16 16 Q10 14 14 10 Q20 18 22 20" fill="url(#vampSkin)" opacity="0.95"/>
    <path d="M48 16 Q54 14 50 10 Q44 18 42 20" fill="url(#vampSkin)" opacity="0.95"/>
    <!-- Hair -->
    <path d="M18 8 Q24 0 32 4 Q40 0 46 8 Q42 14 32 16 Q22 14 18 8" fill="#030712" opacity="0.95"/>
    <!-- Blood stain on cape -->
    <path d="M28 44 Q36 46 40 52 Q36 50 28 44" fill="#7f1d1d" opacity="0.8"/>
    <path d="M30 46 Q38 48 42 54 Q38 52 30 46" fill="#7f1d1d" opacity="0.7"/>
    <!-- Glow -->
    <ellipse cx="32" cy="24" rx="24" ry="20" fill="url(#vampEye)"/>
  </g>
</svg>