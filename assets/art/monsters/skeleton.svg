<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="skelBody" cx="50%" cy="50%" r="70%">
      <stop offset="0%" style="stop-color:#1f2937"/>
      <stop offset="100%" style="stop-color:#0b0c10"/>
    </radialGradient>
    <linearGradient id="skelBone" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e5e7eb"/>
      <stop offset="60%" style="stop-color:#d1d5db"/>
      <stop offset="100%" style="stop-color:#9ca3af"/>
    </linearGradient>
    <radialGradient id="skelEye" cx="50%" cy="50%" r="60%">
      <stop offset="0%" style="stop-color:#ef4444"/>
      <stop offset="100%" style="stop-color:#7f1d1d"/>
    </radialGradient>
    <filter id="skelShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>
  <g filter="url(#skelShadow)">
    <!-- Dark tattered robes -->
    <path d="M12 52 Q32 44 52 52 L52 64 Q32 58 12 64 Z" fill="#0b0c10" opacity="0.95"/>
    <path d="M16 50 Q32 42 48 50 L48 58 Q32 54 16 58 Z" fill="#111827" opacity="0.9"/>
    <!-- Ragged robe edges -->
    <path d="M12 52 Q8 50 10 44 Q12 42 14 46 M32 52 Q28 50 30 44 Q32 42 34 46 M52 52 Q56 50 54 44 Q52 42 50 46" fill="none" stroke="#0a0a0f" stroke-width="1"/>
    <!-- Ribcage -->
    <g fill="none" stroke="url(#skelBone)" stroke-width="1.5" opacity="0.95">
      <path d="M26 24 Q32 20 38 24"/>
      <path d="M26 28 Q32 24 38 28"/>
      <path d="M26 32 Q32 28 38 32"/>
      <path d="M26 36 Q32 32 38 36"/>
      <path d="M24 22 Q32 18 40 22"/>
      <path d="M24 26 Q32 22 40 26"/>
      <path d="M24 30 Q32 26 40 30"/>
      <path d="M22 24 Q32 20 42 24"/>
    </g>
    <!-- Sternum -->
    <g fill="url(#skelBone)">
      <circle cx="28" cy="24" r="1.8"/>
      <circle cx="36" cy="24" r="1.8"/>
      <circle cx="28" cy="28" r="1.8"/>
      <circle cx="36" cy="28" r="1.8"/>
      <circle cx="28" cy="32" r="1.8"/>
      <circle cx="36" cy="32" r="1.8"/>
      <circle cx="28" cy="36" r="1.8"/>
      <circle cx="36" cy="36" r="1.8"/>
      <circle cx="28" cy="40" r="1.8"/>
      <circle cx="36" cy="40" r="1.8"/>
    </g>
    <!-- Spine -->
    <path d="M32 20 Q32 32 32 44" fill="none" stroke="url(#skelBone)" stroke-width="1.5" opacity="0.95"/>
    <g fill="url(#skelBone)">
      <circle cx="30" cy="24" r="1.2"/>
      <circle cx="34" cy="24" r="1.2"/>
      <circle cx="30" cy="28" r="1.2"/>
      <circle cx="34" cy="28" r="1.2"/>
      <circle cx="30" cy="32" r="1.2"/>
      <circle cx="34" cy="32" r="1.2"/>
      <circle cx="30" cy="36" r="1.2"/>
      <circle cx="34" cy="36" r="1.2"/>
      <circle cx="30" cy="40" r="1.2"/>
      <circle cx="34" cy="40" r="1.2"/>
    </g>
    <!-- Skull -->
    <path d="M20 12 Q32 4 44 12 Q32 20 20 12" fill="url(#skelBone)" opacity="0.95"/>
    <path d="M22 10 Q32 8 42 10 Q32 16 22 10 Z" fill="#d1d5db" opacity="0.9"/>
    <!-- Eye sockets -->
    <circle cx="26" cy="14" r="2.5" fill="#000"/>
    <circle cx="38" cy="14" r="2.5" fill="#000"/>
    <!-- Glowing red eyes -->
    <circle cx="26" cy="13.5" r="1.2" fill="url(#skelEye)"/>
    <circle cx="38" cy="13.5" r="1.2" fill="url(#skelEye)"/>
    <circle cx="26" cy="13" r="0.5" fill="#fca5a5"/>
    <circle cx="38" cy="13" r="0.5" fill="#fca5a5"/>
    <!-- Nasal cavity -->
    <path d="M28 16 Q32 18 36 16" fill="none" stroke="#000" stroke-width="1.5"/>
    <!-- Jaw -->
    <path d="M24 18 Q32 22 40 18 L40 22 Q32 26 24 22 Z" fill="#d1d5db"/>
    <!-- Teeth -->
    <g fill="#e5e7eb">
      <rect x="28" y="19" width="2" height="1"/>
      <rect x="30" y="19" width="2" height="1"/>
      <rect x="32" y="19" width="2" height="1"/>
      <rect x="34" y="19" width="2" height="1"/>
    </g>
    <!-- Cracked bones -->
    <g stroke="#9ca3af" stroke-width="0.5" fill="none" opacity="0.6">
      <path d="M20 14 L16 10 M44 14 L48 10"/>
      <path d="M20 18 L16 22 M44 18 L48 22"/>
      <path d="M24 16 L20 20 M40 16 L44 20"/>
    </g>
    <!-- Rusty sword -->
    <path d="M10 44 L6 56 Q4 58 10 52 Q14 48 18 46" fill="none" stroke="#6b7280" stroke-width="2.5"/>
    <path d="M10 44 L6 56 Q4 58 10 52 Q14 48 18 46" fill="none" stroke="#92400e" stroke-width="1.2"/>
    <!-- Hilt -->
    <rect x="8" y="40" width="4" height="6" rx="0.5" fill="#374151"/>
    <path d="M8 40 L4 38 L8 40 L4 42" fill="none" stroke="#92400e" stroke-width="1"/>
    <!-- Blood stains -->
    <g fill="#7f1d1d" opacity="0.8">
      <ellipse cx="16" cy="46" rx="2.5" ry="1.5"/>
      <ellipse cx="48" cy="46" rx="2" ry="1.5"/>
      <path d="M32 44 Q34 48 32 52" fill="#7f1d1d" opacity="0.7"/>
    </g>
    <!-- Glow -->
    <ellipse cx="32" cy="24" rx="24" ry="20" fill="url(#skelEye)"/>
  </g>
</svg>