<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="impBody" cx="40%" cy="40%" r="70%">
      <stop offset="0%" style="stop-color:#1f2937"/>
      <stop offset="50%" style="stop-color:#111827"/>
      <stop offset="100%" style="stop-color:#0b0c10"/>
    </radialGradient>
    <radialGradient id="impEye" cx="45%" cy="45%" r="60%">
      <stop offset="0%" style="stop-color:#fca5a5"/>
      <stop offset="100%" style="stop-color:#7f1d1d"/>
    </radialGradient>
    <filter id="impShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>
  <g filter="url(#impShadow)">
    <!-- Bat wings spread -->
    <path d="M44 18 Q58 8 62 22 Q56 32 46 24 Z" fill="#0b0c10" opacity="0.95"/>
    <path d="M20 18 Q6 8 2 22 Q8 32 18 24 Z" fill="#0b0c10" opacity="0.95"/>
    <!-- Wing membranes -->
    <path d="M46 22 Q50 24 54 20 Q52 26 48 24 Q46 22 46 22" fill="#111827" opacity="0.8"/>
    <path d="M18 22 Q14 24 10 20 Q12 26 16 24 Q18 22 18 22" fill="#111827" opacity="0.8"/>
    <path d="M48 24 Q52 26 56 22 Q54 28 50 26 Q48 24 48 24" fill="#111827" opacity="0.8"/>
    <path d="M16 24 Q12 26 8 24 Q10 28 14 26 Q16 24 16 24" fill="#111827" opacity="0.8"/>
    <!-- Horns -->
    <path d="M22 10 Q18 0 22 -2 Q26 8 22 10" fill="#111827"/>
    <path d="M42 10 Q46 0 42 -2 Q38 8 42 10" fill="#111827"/>
    <!-- Smaller horns -->
    <path d="M26 12 Q24 4 26 2 Q30 10 26 12" fill="#111827"/>
    <path d="M38 12 Q40 4 38 2 Q34 10 38 12" fill="#111827"/>
    <!-- Body -->
    <ellipse cx="32" cy="38" rx="14" ry="10" fill="url(#impBody)" opacity="0.95"/>
    <path d="M22 32 Q32 40 42 32 Q32 24 22 32 Z" fill="#111827" opacity="0.9"/>
    <!-- Head -->
    <ellipse cx="32" cy="20" rx="12" ry="11" fill="url(#impBody)" opacity="0.95"/>
    <path d="M22 12 Q32 6 42 12 Q32 18 22 12 Z" fill="#0b0c10" opacity="0.9"/>
    <!-- Eyes -->
    <ellipse cx="26" cy="18" rx="3" ry="3.5" fill="#0a0a0f"/>
    <ellipse cx="38" cy="18" rx="3" ry="3.5" fill="#0a0a0f"/>
    <!-- Socket highlights -->
    <ellipse cx="25" cy="17" rx="1.2" ry="1.8" fill="#374151" opacity="0.5"/>
    <ellipse cx="37" cy="17" rx="1.2" ry="1.8" fill="#374151" opacity="0.5"/>
    <!-- Glowing yellow eyes -->
    <circle cx="26" cy="18" r="1.6" fill="#fbbf24"/>
    <circle cx="38" cy="18" r="1.6" fill="#fbbf24"/>
    <circle cx="26" cy="17.5" r="0.7" fill="#fde68a"/>
    <circle cx="38" cy="17.5" r="0.7" fill="#fde68a"/>
    <!-- Grin -->
    <path d="M24 28 Q32 32 40 28" stroke="#0a0a0f" stroke-width="1.5" fill="none"/>
    <path d="M27 28 L27 32" stroke="#fbbf24" stroke-width="0.8"/>
    <path d="M29 28 L29 32" stroke="#fbbf24" stroke-width="0.8"/>
    <path d="M35 28 L35 32" stroke="#fbbf24" stroke-width="0.8"/>
    <path d="M37 28 L37 32" stroke="#fbbf24" stroke-width="0.8"/>
    <!-- Tail with spade -->
    <path d="M44 38 Q52 42 50 50 Q48 46 46 42" fill="#111827"/>
    <path d="M50 50 L48 56" stroke="#dc2626" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M46 56 L50 56 L48 60" fill="#dc2626"/>
    <!-- Claws -->
    <g stroke="#e5e7eb" stroke-width="1.5" fill="none" stroke-linecap="round">
      <line x1="18" y1="36" x2="14" y2="42"/>
      <line x1="20" y1="36" x2="15" y2="43"/>
      <line x1="46" y1="36" x2="50" y2="42"/>
      <line x1="44" y1="36" x2="49" y2="43"/>
    </g>
    <!-- Blood-red accents -->
    <circle cx="32" cy="12" r="0.6" fill="#dc2626"/>
    <circle cx="30" cy="17.5" r="0.3" fill="#ef4444"/>
    <circle cx="34" cy="17.5" r="0.3" fill="#ef4444"/>
    <!-- Glow -->
    <ellipse cx="32" cy="24" rx="22" ry="18" fill="url(#impEye)"/>
  </g>
</svg>