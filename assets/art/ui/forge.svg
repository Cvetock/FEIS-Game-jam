<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="forgeGlow" cx="50%" cy="50%" r="70%">
      <stop offset="0%" style="stop-color:#dc2626;stop-opacity:0.5"/>
      <stop offset="100%" style="stop-color:#7f1d1d;stop-opacity:0"/>
    </radialGradient>
    <filter id="forgeGlowFilter" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#dc2626" flood-opacity="0.4"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="64" height="64" fill="#0b0c10"/>
  <!-- Forge building -->
  <rect x="8" y="26" width="48" height="26" rx="2" fill="#111827" stroke="#374151" stroke-width="1"/>
  <path d="M6 26 L32 10 L58 26" fill="#1f2937" stroke="#374151" stroke-width="1"/>
  <!-- Chimney -->
  <rect x="42" y="14" width="8" height="14" fill="#111827" stroke="#374151" stroke-width="1"/>
  <!-- Smoke -->
  <g fill="#4b5563" opacity="0.7">
    <ellipse cx="46" cy="10" rx="6" ry="4"/>
    <ellipse cx="48" cy="6" rx="4" ry="3"/>
  </g>
  <!-- Forge door -->
  <rect x="26" y="34" width="12" height="16" rx="1" fill="#0a0a0f" stroke="#374151" stroke-width="1"/>
  <!-- Anvil -->
  <rect x="18" y="40" width="14" height="8" rx="1" fill="#4b5563"/>
  <rect x="18" y="40" width="14" height="2" fill="#9ca3af"/>
  <path d="M18 48 L32 48" stroke="#6b7280" stroke-width="1"/>
  <!-- Hammer -->
  <path d="M34 40 Q38 38 40 34 L44 30" fill="none" stroke="#374151" stroke-width="3" stroke-linecap="round"/>
  <rect x="40" y="26" width="8" height="6" rx="1" fill="#4b5563"/>
  <!-- Fire -->
  <g filter="url(#forgeGlowFilter)">
    <path d="M24 52 Q26 44 28 52 Q30 44 32 52 Q34 44 36 52 Q38 44 40 52 L40 56 L24 56 Z" fill="#ef4444"/>
    <path d="M26 50 Q28 44 30 50 Q32 44 34 50 Q36 44 38 50" fill="#fbbf24" opacity="0.8"/>
    <circle cx="32" cy="48" r="3" fill="#fde68a" opacity="0.9"/>
  </g>
  <!-- Sparks -->
  <g fill="#fbbf24">
    <circle cx="22" cy="48" r="1"/>
    <circle cx="42" cy="46" r="1"/>
    <circle cx="20" cy="44" r="0.8"/>
    <circle cx="44" cy="42" r="0.8"/>
  </g>
  <!-- Red glow -->
  <ellipse cx="32" cy="34" rx="24" ry="24" fill="url(#forgeGlow)"/>
</svg>