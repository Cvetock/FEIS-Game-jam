<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="sewerGlow" cx="50%" cy="50%" r="70%">
      <stop offset="0%" style="stop-color:#111827;stop-opacity:0.4"/>
      <stop offset="100%" style="stop-color:#0b0c10;stop-opacity:0"/>
    </radialGradient>
  </defs>
  <rect x="0" y="0" width="64" height="64" fill="#0b0c10"/>
  <!-- Sewer tunnel arch -->
  <path d="M8 56 Q8 20 32 20 Q56 20 56 56" fill="none" stroke="#374151" stroke-width="4" stroke-linecap="round"/>
  <!-- Inner darkness -->
  <path d="M12 52 Q12 24 32 24 Q52 24 52 52" fill="#030712" opacity="0.95"/>
  <!-- Brick pattern -->
  <g stroke="#1f2937" stroke-width="1" fill="none">
    <line x1="12" y1="30" x2="52" y2="30"/>
    <line x1="12" y1="40" x2="52" y2="40"/>
    <line x1="12" y1="50" x2="52" y2="50"/>
    <line x1="22" y1="24" x2="22" y2="52"/>
    <line x1="32" y1="24" x2="32" y2="52"/>
    <line x1="42" y1="24" x2="42" y2="52"/>
  </g>
  <!-- Brick offset row -->
  <g stroke="#1f2937" stroke-width="1" fill="none">
    <line x1="17" y1="35" x2="47" y2="35"/>
    <line x1="17" y1="45" x2="47" y2="45"/>
    <line x1="27" y1="29" x2="27" y2="51"/>
    <line x1="37" y1="29" x2="37" y2="51"/>
  </g>
  <!-- Water -->
  <path d="M12 54 Q32 50 52 54 L52 60 Q32 56 12 60 Z" fill="#1e293b" opacity="0.9"/>
