    <path d="M16 56 Q24 54 32 56 Q40 54 48 56"/>
    <path d="M18 58 Q26 56 34 58 Q42 56 50 58"/>
  </g>
  <!-- Rat -->
  <g fill="#374151">
    <ellipse cx="20" cy="52" rx="6" ry="3"/>
    <circle cx="26" cy="50" r="2" fill="#1f2937"/>
    <circle cx="26" cy="49" r="0.8" fill="#dc2626"/>
  </g>
  <!-- Pipe -->
  <path d="M8 32 Q12 30 16 32 Q20 30 24 32" fill="none" stroke="#4b5563" stroke-width="2"/>
  <path d="M24 32 Q28 30 32 32 Q36 30 40 32" fill="none" stroke="#4b5563" stroke-width="2"/>
  <path d="M40 32 Q44 30 48 32 Q52 30 56 32" fill="none" stroke="#4b5563" stroke-width="2"/>
  <!-- Drips -->
  <g fill="#374151">
    <path d="M12 30 Q12 34 14 30 Z"/>
    <path d="M28 30 Q28 34 30 30 Z"/>
    <path d="M44 30 Q44 34 46 30 Z"/>
