  </g>
  <!-- Strap -->
  <path d="M16 34 Q16 44 24 46 Q32 48 40 46 Q48 44 48 34" fill="none" stroke="#374151" stroke-width="2"/>
  <!-- Focus rings -->
  <g stroke="#6b7280" stroke-width="1" fill="none">
