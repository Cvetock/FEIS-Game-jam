<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="reconGlow" cx="50%" cy="50%" r="70%">
      <stop offset="0%" style="stop-color:#a855f7;stop-opacity:0.4"/>
      <stop offset="100%" style="stop-color:#6b21a8;stop-opacity:0"/>
    </radialGradient>
  </defs>
  <rect x="0" y="0" width="64" height="64" fill="#0b0c10"/>
  <!-- Binoculars body -->
  <g fill="#1f2937" stroke="#374151" stroke-width="1">
    <rect x="18" y="24" width="28" height="16" rx="2"/>
    <circle cx="26" cy="32" r="7" fill="#111827"/>
    <circle cx="38" cy="32" r="7" fill="#111827"/>
  </g>
  <!-- Lenses -->
  <g fill="#0a0a0f">
    <circle cx="26" cy="32" r="5"/>
    <circle cx="38" cy="32" r="5"/>
  </g>
