<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FEIS Game Jam — 2D Стратегия-Роуглайк</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #111; color: #eee; font-family: system-ui, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; overflow: hidden; }
  canvas { border: 2px solid #444; background: #0b0c10; max-width: 100%; max-height: 100%; image-rendering: pixelated; }
  #ui { position: absolute; top: 10px; left: 10px; font-size: 14px; pointer-events: none; text-shadow: 1px 1px 0 #000; }
  #msg { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 24px; text-align: center; pointer-events: none; }
</style>
</head>
<body>
<div id="ui">FPS: <span id="fps">0</span> | Волна: <span id="wave">0</span> | Ресурсы: <span id="res">0</span></div>
<div id="msg">Нажмите любую клавишу или кликните, чтобы начать</div>
<canvas id="game" width="640" height="480"></canvas>
<script type="module" src="src/main.js"></script>
</body>
</html>
